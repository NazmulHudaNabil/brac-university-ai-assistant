version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bracu-ai-assistant-backend:latest
    container_name: bracu-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bracu-ai-assistant-frontend:latest
    container_name: bracu-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      # Point Streamlit to the backend container's internal network address
      - BACKEND_API_URL=http://backend:8000/chat
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
